name: Weekly Meal Plan Notification

on:
  schedule:
    # Run every Monday at 8:00 AM UTC (adjust timezone as needed)
    - cron: '0 8 * * 1'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      weeks:
        description: 'Weeks to fetch (space-separated, e.g., "2 3")'
        required: false
        default: '2 3'

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root
      
      - name: Fetch meal plans and send notification
        env:
          DISCORD_WEBHOOK_MEALS: ${{ secrets.DISCORD_WEBHOOK_MEALS }}
          DISCORD_WEBHOOK_SHOPPING: ${{ secrets.DISCORD_WEBHOOK_SHOPPING }}
          DISCORD_WEBHOOK_SUMMARY: ${{ secrets.DISCORD_WEBHOOK_SUMMARY }}
        run: |
          WEBHOOK_ARGS=""
          
          if [ -n "$DISCORD_WEBHOOK_MEALS" ]; then
            WEBHOOK_ARGS="$WEBHOOK_ARGS --discord-webhook-meals \"$DISCORD_WEBHOOK_MEALS\""
          fi
          
          if [ -n "$DISCORD_WEBHOOK_SHOPPING" ]; then
            WEBHOOK_ARGS="$WEBHOOK_ARGS --discord-webhook-shopping \"$DISCORD_WEBHOOK_SHOPPING\""
          fi
          
          if [ -n "$DISCORD_WEBHOOK_SUMMARY" ]; then
            WEBHOOK_ARGS="$WEBHOOK_ARGS --discord-webhook-summary \"$DISCORD_WEBHOOK_SUMMARY\""
          fi
          
          if [ -z "$WEBHOOK_ARGS" ]; then
            echo "⚠️  No Discord webhook secrets set. Running without Discord notifications."
            poetry run python fetch_weekly_plan.py --weeks ${{ github.event.inputs.weeks || '2 3' }}
          else
            eval poetry run python fetch_weekly_plan.py --weeks ${{ github.event.inputs.weeks || '2 3' }} $WEBHOOK_ARGS
          fi
